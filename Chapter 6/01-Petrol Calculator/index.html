<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrol Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">
        <h2>Petrol Calculator</h2>
        
        <div class="input-group">
            <label for="costPerLiter">Cost of Petrol per Liter (£):</label>
            <input type="number" id="costPerLiter" value="1.72" step="0.01" min="0">
        </div>

        <div class="input-group">
            <label for="litersPurchased">Liters Purchased:</label>
            <input type="number" id="litersPurchased" value="0" step="0.01" min="0">
        </div>

        <button id="calculateBtn">Calculate Total Cost</button>

        <p id="resultText">Total Cost: £0.00</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
