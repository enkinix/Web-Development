<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Theme: Landscapes & Spring Blossoms</h2>
    </header>

    <main class="gallery-container">
        
        <figure class="gallery-card">
            <img src="images/joel-holland-TRhGEGdw-YY-unsplash.jpg" 
                 alt="A wide field of yellow and red wildflowers under a dramatic stormy sky at sunset" 
                 title="Alpine Meadow Sunset" 
                 width="500" 
                 height="333">
            <figcaption class="photo-credit">
                photo by <a href="https://unsplash.com/@joelholland?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText" target="_blank" rel="noopener">Joel Holland</a> on <a href="https://unsplash.com/photos/aerial-photography-of-flowers-at-daytime-TRhGEGdw-YY?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText" target="_blank" rel="noopener">Unsplash</a>
            </figcaption>
        </figure>

        <figure class="gallery-card">
            <img src="images/pascal-debrunner-i2VjsIrKLtY-unsplash.jpg" 
                 alt="A row of trees in an orchard surrounded by a field of white flowers in morning mist" 
                 title="Misty Spring Morning" 
                 width="500" 
                 height="333">
            <figcaption class="photo-credit">
                photo by <a href="https://unsplash.com/@debrupas?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText" target="_blank" rel="noopener">Pascal Debrunner</a> on <a href="https://unsplash.com/photos/a-group-of-trees-in-a-grassy-field-i2VjsIrKLtY?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText" target="_blank" rel="noopener">Unsplash</a>
            </figcaption>
        </figure>

        <figure class="gallery-card">
            <img src="images/arno-smit-sKJ7zSylUao-unsplash.jpg" 
                 alt="A close-up view looking up into a cherry blossom tree with bright pink flowers against a blue sky" 
                 title="Cherry Blossoms in Bloom" 
                 width="500" 
                 height="312">
            <figcaption class="photo-credit">
                photo by <a href="https://unsplash.com/@_entreprenerd?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText" target="_blank" rel="noopener">Arno Smit</a> on <a href="https://unsplash.com/photos/low-angle-photo-of-cherry-blossoms-tree-sKJ7zSylUao?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText" target="_blank" rel="noopener">Unsplash</a>
            </figcaption>
        </figure>

    </main>

</body>
</html>
